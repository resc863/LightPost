[package]
name = "lightpost"
version = "0.1.0"
edition = "2021"
description = "A small personal blog built with Rust, Axum, HTML, CSS, and Vanilla JS"
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
getrandom = "0.4"
maud = "0.27"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
